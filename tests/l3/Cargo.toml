[package]
name = "l3"
version = "0.1.0"
edition = "2021"

# 产物由 `jrust build tests/l3/src` 生成在 src/ 下（放 src/ 可避开 cargo 把
# tests/<名字>/main.rs 自动发现成集成测试目标）。
[[bin]]
name = "l3"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
